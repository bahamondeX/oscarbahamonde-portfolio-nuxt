name: Portfolio browser checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      E2E_BASE_URL: http://127.0.0.1:3187
      NUXT_PUBLIC_ASSISTANT_URL: https://assistant.example.test
      NUXT_PUBLIC_TURNSTILE_SITE_KEY: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Start isolated local build
        run: |
          NITRO_PORT=3187 NITRO_HOST=127.0.0.1 node .output/server/index.mjs > /tmp/portfolio-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3187/es > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/portfolio-server.log
          exit 1
      - name: All browser checks
        run: npx playwright test
      - name: Aggregate rendered logo evidence
        if: always()
        run: node scripts/logo-report.mjs
      - name: Preserve evidence for successful and failed attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-evidence-${{ github.sha }}
          retention-days: 30
          path: |
            reports/playwright-results.json
            reports/playwright/
            reports/playwright-artifacts/
            docs/audit/after/logo-captures/
            docs/audit/after/logo-contrast-rendered.json
